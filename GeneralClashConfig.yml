#---------------------------------------------------#
#  mihomo/MetaCube 配置模板 - GeneralClashConfig.yml
#
#  用途：subconverter 的 Clash 基础模板（clash_rule_base）
#  说明：proxies / proxy-groups / rules 由 subconverter 生成，
#        本文件提供端口 / DNS / TUN / 嗅探等框架配置
#  参考文档：
#    - https://wiki.metacubex.one/config/
#    - https://github.com/MetaCubeX/mihomo/blob/Meta/docs/config.yaml
#
#  变更说明（2026-08-23 对照官方文档重写，替换 CFW 版）：
#  1. 移除所有 cfw-* GUI 专属字段（mihomo 不识别）
#  2. DNS 配置使用 mihomo 新版结构（default-nameserver / nameserver-policy）
#  3. 新增 geox-url / geo-auto-update / geodata-loader
#  4. 新增 sniffer 域名嗅探（sniff: 新格式）
#  5. TUN 配置（默认关闭），IP 段排除迁移自原 cfw-bypass
#  6. profile 持久化选择
#---------------------------------------------------#

# 入站端口（与 pref.toml template.globals 保持一致）
port: 7890        # HTTP(S) 代理端口
socks-port: 7891  # SOCKS5 代理端口
# redir-port: 7892   # 透明代理端口（Linux/macOS）
# tproxy-port: 7893  # TProxy 端口（Linux）

# 局域网
allow-lan: true                    # 允许局域网连接
bind-address: "*"                  # 绑定所有 IP 地址（仅 allow-lan 为 true 时生效）
lan-allowed-ips:                   # 允许连接的 IP 段（默认 0.0.0.0/0 和 ::/0）
  - 0.0.0.0/0
  - ::/0
# lan-disallowed-ips:              # 禁止连接的 IP 段（黑名单优先级高于白名单）
#   - 192.168.0.3/32
skip-auth-prefixes:                # 设置跳过验证的 IP 段
  - 127.0.0.1/8
  - ::1/128
# authentication:                  # http/socks/mixed 代理的用户验证
#   - "user1:pass1"

# 进程匹配模式：always（强制）/ strict（默认，自动判断）/ off（路由器推荐）
find-process-mode: strict

# 运行模式：rule（规则）/ global（全局代理）/ direct（全局直连）
mode: rule
log-level: info                    # silent / error / warning / info / debug
ipv6: true                         # IPv6 总开关，关闭会阻断所有 IPv6 连接并屏蔽 AAAA 查询

# GEO 数据库（国内加速源）
geox-url:
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
geo-auto-update: true              # 是否自动更新 geodata
geo-update-interval: 24            # 更新间隔，单位：小时
geodata-loader: memconservative    # GEO 加载模式：standard / memconservative（默认）

# 外部控制（RESTful API）
external-controller: 127.0.0.1:9090
# secret: "your-secret-here"       # Authorization: Bearer ${secret}
external-controller-cors:          # RESTful API CORS 标头配置
  allow-origins:
    - "*"
  allow-private-network: true
# Web UI（http://127.0.0.1:9090/ui）
# external-ui: dashboard
# external-ui-url: "https://github.com/Zephyroso/zashboard/releases/latest/download/dist.zip"

# profile：持久化选择与 fake-ip 映射
profile:
  store-selected: true             # 存储 select 策略组选择记录
  store-fake-ip: true              # 持久化 fake-ip 映射表

# TLS（仅 API HTTPS 需要时启用）
# tls:
#   certificate: /path/to/cert.pem
#   private-key: /path/to/key.pem

# TCP 并发（连接所有解析 IP，使用最快握手的连接）
# tcp-concurrent: true
# TCP Keep Alive（移动端省电）
# disable-keep-alive: false
# keep-alive-idle: 15
# keep-alive-interval: 15

# 出口网卡 / 路由标记（仅 Linux）
# interface-name: en0
# routing-mark: 6666

# hosts（类似 /etc/hosts，仅支持单个 IP；fake-ip 模式下不生效）
# hosts:
#   '*.clash.dev': 127.0.0.1
#   'test.com': [1.1.1.1, 2.2.2.2]

# DNS 配置
dns:
  enable: true
  ipv6: true                       # false 将返回 AAAA 的空结果
  listen: 0.0.0.0:53               # 监听地址（本机 53 被占用时可改 127.0.0.1:53）
  enhanced-mode: fake-ip           # fake-ip / redir-host
  fake-ip-range: 198.18.0.1/16     # fake-ip 池
  fake-ip-filter:                  # 不使用 fake-ip 的域名
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
    - "+.music.126.net"
    # geosite 写法（需 geosite 库存在该分类）
    # - geosite:fakeip-filter
    # 规则集写法（behavior 必须为 domain/classical）
    # - rule-set:fakeip-filter
  # fake-ip-filter-mode: blacklist # blacklist（默认）/ whitelist / rule
  fake-ip-ttl: 1                   # fake-ip 查询返回的 TTL

  # 仅用于解析 nameserver / fallback 中 DNS 服务域名的上游（只能用 IP 或加密 DNS）
  default-nameserver:
    - 114.114.114.114
    - 223.5.5.5
    - tls://1.12.12.12:853
    - tls://223.5.5.5:853
    - system

  # 主要 DNS：影响所有直连流量，使用对大陆解析精准的 DNS
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - 223.5.5.5
    - 119.29.29.29

  # 境外 DNS：nameserver 返回非 CN 结果时使用
  fallback:
    - tls://8.8.8.8
    - tls://1.1.1.1
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query

  fallback-filter:
    geoip: true                    # 查询 geoip 判断是否 CN
    geoip-code: CN                 # 解析结果为 CN 时使用 nameserver 的结果
    ipcidr:                        # 命中这些 IP 段时使用 fallback 的结果
      - 240.0.0.0/4
      - 0.0.0.0/32
      - 127.0.0.1/32
    domain:                        # 这些域名直接使用 fallback 解析
      - "+.google.com"
      - "+.facebook.com"
      - "+.youtube.com"

  # 域名 → 指定 DNS 服务器（精确映射）
  nameserver-policy:
    # 苹果 / 国内服务 / 私有地址，走国内 DoH 避免污染
    "geosite:cn,private,apple":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    # 广告域名返回"查询成功但无结果"（DNS 层广告拦截，与规则集互补）
    "geosite:category-ads-all":
      - rcode://success

# 域名嗅探（通过 TLS SNI / HTTP Host 识别域名，配合 fake-ip 精准匹配）
sniffer:
  enable: true
  force-dns-mapping: true          # 对 redir-host 类型识别的流量强制嗅探
  parse-pure-ip: true              # 对所有未获取到域名的流量强制嗅探
  override-destination: false      # 不使用嗅探结果替代原目标，避免误判
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  # force-domain:                  # 强制嗅探的域名
  #   - +.v2ex.com
  # skip-domain:                   # 跳过嗅探的域名
  #   - Mijia Cloud
  # skip-src-address:              # 跳过嗅探的来源 IP 段
  #   - 192.168.0.3/32
  # skip-dst-address:              # 跳过嗅探的目标 IP 段
  #   - 192.168.0.3/32

# TUN 模式（默认关闭，需要时改为 enable: true）
# 说明：route-exclude-address 的 IP 段迁移自原 cfw-bypass，
#       匹配的流量绕过路由；国内域名直连由规则集 DIRECT 处理
tun:
  enable: false
  stack: mixed                     # system / gvisor / mixed（官方建议 mixed）
  auto-route: true                 # 自动配置路由表
  auto-detect-interface: true      # 自动识别出口网卡
  dns-hijack:                      # 劫持 DNS 到内部模块
    - any:53
    - tcp://any:53
  strict-route: true               # 严格路由，防止 DNS 泄露（Android/Windows 建议）
  route-exclude-address:           # 排除网段（原 cfw-bypass IP 段）
    - 127.0.0.0/8                  # 环回
    - 10.0.0.0/8                   # 内网 A 类
    - 172.16.0.0/12                # 内网 B 类（172.16-172.31 合并）
    - 192.168.0.0/16               # 内网 C 类
    - fe80::/10                    # 链路本地地址
    - fc00::/7                     # IPv6 唯一本地地址
    - 224.0.0.0/4                  # 组播地址
    - 240.0.0.0/4                  # 保留地址
  # mtu: 9000                      # 最大传输单元
  # udp-timeout: 300               # UDP NAT 过期时间（秒）
  # include-android-user:          # Android 用户限制（需要 auto-route）
  #   - 0                          # 机主
  # exclude-package:               # 排除应用不走 TUN
  #   - com.android.captiveportallogin
  # include-interface:             # 限制路由接口（与 auto-detect-interface 互斥）
  #   - eth0
  # exclude-interface:
  #   - eth1

# 以下三段由 subconverter 生成，此处仅作占位
proxies: []
proxy-groups: []
rules: []
